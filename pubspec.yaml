name: aura_ai_assistant
description: AI-Powered Assistant App - Aura AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0

  # HuggingFace SDK
  huggingface_client: any

  # HTTP (for img2img fallback)
  http: any

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

  # Image Picker
  image_picker: any

  # UI
  flutter_markdown: any
  google_fonts: any
  flutter_animate: any

  # Voice & TTS
  speech_to_text: any
  flutter_tts: any
  permission_handler: any

  # Utils
  uuid: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env